<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Connect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Pacifico&family=Playfair+Display:wght@600&family=Bebas+Neue&family=Fredoka:wght@500&family=Space+Mono:wght@700&family=Dancing+Script:wght@600&family=Fraunces:wght@600&family=Permanent+Marker&family=Josefin+Sans:wght@600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--card:#fff;--tx:#222;--mu:#7a7a7a;--ac:#2f6f5e;--acx:#fff;--bd:#e5e0d8;--warn:#b4472f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171917;--card:#222522;--tx:#eee;--mu:#9a9f9a;--ac:#6cc4a8;--acx:#10231d;--bd:#363a36;--warn:#e88a73}}
:root[data-theme="dark"]{--bg:#171917;--card:#222522;--tx:#eee;--mu:#9a9f9a;--ac:#6cc4a8;--acx:#10231d;--bd:#363a36;--warn:#e88a73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.scr{max-width:480px;margin:0 auto;padding:0 20px 50px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;min-height:56px}
.mid{padding-top:9vh;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.mid.left{align-items:stretch;text-align:left;padding-top:2vh}
.pn{color:var(--cl)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pn{color:var(--cd)}}
:root[data-theme="dark"] .pn{color:var(--cd)}
.lbl{color:var(--mu);font-size:.85rem;margin:0}.mu{color:var(--mu);font-size:.9rem}.over{color:var(--warn)}
.next{background:none;border:none;font-size:3rem;line-height:1.1;padding:6px 10px}
.big{font-size:2.8rem;line-height:1.1;word-break:break-word}.big.sm{font-size:1.7rem}
button,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
button{cursor:pointer}button:disabled{opacity:.35}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.g{border:none;background:none;color:var(--mu)}
.wide{width:100%}
input,textarea{width:100%}textarea{min-height:110px;resize:vertical}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--card);border:1px solid var(--bd);border-radius:14px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;padding:16px;min-height:130px}
.tx{white-space:pre-wrap}.dt{color:var(--mu);font-size:.8rem;margin-top:10px}
.pos{text-align:center;color:var(--mu);font-size:.8rem;min-height:1.2em;margin-top:-8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fonts button{font-size:1.35rem;padding:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sel{outline:3px solid var(--ac)}
.prev{font-size:2.6rem;line-height:1.2;padding:8px 0;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border-radius:99px;padding:5px 12px;font-size:.9rem}
.r2{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:12px 14px;font-size:1.3rem;text-align:left}
.sn{display:block;font:.85rem system-ui,sans-serif;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px}
#res{width:100%;text-align:left}#res button{display:block;width:100%;margin-bottom:6px;text-align:left;font-size:1.2rem}
.nudge{font-size:.85rem;color:var(--mu)}.nudge a{color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;display:none;z-index:9}
</style></head><body>
<div class="scr" id="app"></div><div id="toast"></div>
<script>
const FONTS=[["Caveat",700,"cursive"],["Pacifico",400,"cursive"],["Playfair Display",600,"serif"],["Bebas Neue",400,"sans-serif"],["Fredoka",500,"sans-serif"],["Space Mono",700,"monospace"],["Dancing Script",600,"cursive"],["Fraunces",600,"serif"],["Permanent Marker",400,"cursive"],["Josefin Sans",600,"sans-serif"]];
const COLS=[["#d9482b","#ff8a70"],["#c2307a","#ff7fbd"],["#7c3aed","#b79bff"],["#4056d6","#8fa0ff"],["#1d71c9","#6db4ff"],["#0f8a8a","#4fd6d0"],["#2a8a3e","#6fdc86"],["#6b7d10","#c0d54a"],["#b86e00","#ffb84a"],["#8a5a3c","#d9a27f"],["#b5179e","#f28de0"],["#b3202e","#ff7b86"]];
const CH=[{l:"1 week",d:7},{l:"2 weeks",d:14},{l:"1 month",m:1},{l:"2 months",m:2},{l:"3 months",m:3},{l:"6 months",m:6},{l:"1 year",m:12}];
const DAY=864e5;
let D=null,V={s:"home"},A={},E={},L={sort:"date",page:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sd=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const rnd=n=>Math.floor(Math.random()*n);
const get=id=>D.people.find(p=>p.id==id);
const nm=p=>{const f=FONTS[p.f]||FONTS[0],c=COLS[p.c]||COLS[0];return `<span class="pn" style="font-family:'${f[0]}',${f[2]};font-weight:${f[1]};--cl:${c[0]};--cd:${c[1]}">${esc(p.name)}</span>`};
const fs=i=>`font-family:'${FONTS[i][0]}',${FONTS[i][2]};font-weight:${FONTS[i][1]}`;
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function dueWords(p){const d=Math.round((sd(p.due)-sd(Date.now()))/DAY);return d<0?`<span class="over">${-d} day${d==-1?"":"s"} overdue</span>`:d==0?"today":`in ${d} day${d==1?"":"s"}`}

/* storage: IndexedDB with localStorage fallback */
let _db;
const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("connect-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
async function load(){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get("data");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){try{return JSON.parse(localStorage.getItem("connect.data"))}catch(x){return null}}}
async function save(){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(D,"data");t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){try{localStorage.setItem("connect.data",JSON.stringify(D))}catch(x){}}}
function migrate(){try{const o=JSON.parse(localStorage.getItem("stayintouch.v1"));if(!o||!o.people||!o.people.length)return null;
 return{people:o.people.map(p=>({id:p.id,name:p.name,f:rnd(FONTS.length),c:rnd(COLS.length),due:p.due,notes:(p.notes||[]).filter(n=>n.text||n.kind!="note").map(n=>({t:n.t,text:n.text||"",ci:n.kind!="note"}))})),firstUse:Date.now(),lastBackup:0}}catch(e){return null}}

/* screens */
function home(){const n=[...D.people].sort((a,b)=>a.due-b.due)[0];
 const ref=D.lastBackup||D.firstUse,old=D.people.length&&Date.now()-ref>30*DAY;
 return `<div class="bar"><button class="g" data-a="settings" aria-label="Settings">⚙︎</button></div><div class="mid">
 ${n?`<p class="lbl">connect soon</p><button class="next" data-a="person" data-id="${n.id}">${nm(n)}</button>`:`<p class="lbl">nobody here yet</p>`}
 <button class="g" data-a="list" aria-label="All connections" style="font-size:1.4rem">⋮</button>
 <input id="q" type="search" placeholder="Search names or notes" autocomplete="off"><div id="res"></div>
 <button class="p" data-a="add">to connect ✎</button>
 ${old?`<p class="nudge">${D.lastBackup?"Last backup was over a month ago.":"No backup yet."} <a href="#" data-a="settings">Back up</a></p>`:""}</div>`}
function results(q){q=q.trim().toLowerCase();if(!q)return "";
 const m=D.people.filter(p=>p.name.toLowerCase().includes(q)||p.notes.some(n=>(n.text||"").toLowerCase().includes(q)));
 if(!m.length)return `<p class="mu" style="text-align:center">No matches</p>`;
 return m.map(p=>{const n=p.name.toLowerCase().includes(q)?null:p.notes.find(n=>(n.text||"").toLowerCase().includes(q));
  return `<button data-a="person" data-id="${p.id}">${nm(p)}${n?`<span class="sn">${esc(n.text.split("\n")[0])}</span>`:""}</button>`}).join("")}
function person(){const p=get(V.id);if(!p){V={s:"home"};return home()}const nt=p.notes;
 return `<div class="bar"><button class="g" data-a="back">‹ Back</button></div><div class="mid left"><div class="big">${nm(p)}</div>
 <div class="car" id="car">${nt.length?nt.map(n=>`<div class="sl"><div class="tx">${n.text?esc(n.text):"<i>Connected, no note.</i>"}</div><div class="dt">${fmt(n.t)}${n.ci?" · ✓ connected":""}</div></div>`).join(""):`<div class="sl"><div class="tx mu"><i>No notes yet.</i></div></div>`}</div>
 <div class="pos" id="pos">${nt.length>1?`1 / ${nt.length} · swipe for older`:""}</div>
 <div class="row"><span>Next: <b>${fmt(p.due)}</b> <span class="mu">· ${dueWords(p)}</span></span><button data-a="date" aria-label="Change next date">🔔</button></div>
 <button class="p wide" data-a="conn">We connected</button><button class="wide" data-a="note">✎ Add a note</button>
 <button class="g" data-a="del">Remove ${esc(p.name)}</button></div>`}
function dateBlock(label,sel){return `<p class="lbl">${label}</p><div class="chips">${CH.map((c,i)=>`<button data-a="chip" data-i="${i}">${c.l}</button>`).join("")}</div><input type="date" id="fd" min="${ymd(new Date())}" value="${sel?ymd(new Date(sel)):""}">`}
function form(){const p=get(E.id),m=E.m;
 return `<div class="bar"><button class="g" data-a="cancel">‹ Cancel</button></div><div class="mid left"><div class="big sm">${nm(p)}</div><h3 style="margin:0">${{conn:"We connected",note:"Add a note",date:"Next reminder"}[m]}</h3>
 ${m!="date"?`<textarea id="ft" placeholder="${m=="conn"?"What's new with them? (optional)":"Say a few words about "+esc(p.name)}"></textarea>`:""}
 ${m!="note"?dateBlock(m=="conn"?"When shall we connect next?":"Remind me on",E.date):""}
 <button class="p wide" data-a="fsave">Save</button></div>`}
function add(){const s=A.step,pv={f:A.f,c:A.c,name:A.name||"Name"};
 let h=`<div class="bar"><button class="g" data-a="${s==1?"cancel":"aback"}">‹ ${s==1?"Cancel":"Back"}</button><span class="mu">${s} / 3</span></div><div class="mid left">`;
 if(s==1)h+=`<input id="an" type="text" placeholder="Name" value="${esc(A.name)}" autocomplete="off"><div class="prev">${nm(pv)}</div><p class="lbl">Pick a font</p><div class="fonts">${FONTS.map((f,i)=>`<button data-a="font" data-i="${i}" class="${i==A.f?"sel":""}" style="${fs(i)}">${A.name?esc(A.name):"Aa"}</button>`).join("")}</div><button data-a="shuf">🎲 Shuffle colour</button><button class="p wide" data-a="anext">Next</button>`;
 else if(s==2)h+=`<div class="big sm">${nm(pv)}</div><textarea id="ab" placeholder="Say a few words about ${esc(A.name)}">${esc(A.about)}</textarea><button class="p wide" data-a="anext">Next</button>`;
 else h+=`<div class="big sm">${nm(pv)}</div>${dateBlock("How soon?",A.date?new Date(A.date+"T09:00:00").getTime():null)}<button class="p wide" data-a="create">to connect ✎</button>`;
 return h+"</div>"}
function list(){const arr=[...D.people].sort(L.sort=="az"?(a,b)=>a.name.localeCompare(b.name):(a,b)=>a.due-b.due),pg=Math.max(1,Math.ceil(arr.length/5));L.page=Math.min(L.page,pg-1);
 const rows=arr.slice(L.page*5,L.page*5+5).map(p=>`<button class="r2" data-a="person" data-id="${p.id}"><span>${nm(p)}</span><span class="mu">${fmt(p.due)}</span></button>`).join("");
 return `<div class="bar"><button class="g" data-a="home">‹ Home</button><button data-a="sort">${L.sort=="az"?"A–Z":"By date"} ⇅</button></div><div class="mid left">${rows||`<p class="mu">Nobody yet.</p>`}<div class="pager"><button data-a="pg" data-d="-1" ${L.page==0?"disabled":""}>‹</button><span class="mu">${L.page+1} / ${pg}</span><button data-a="pg" data-d="1" ${L.page>=pg-1?"disabled":""}>›</button></div></div>`}
function settings(){const lb=D.lastBackup?Math.round((Date.now()-D.lastBackup)/DAY):null;
 return `<div class="bar"><button class="g" data-a="home">‹ Home</button></div><div class="mid left"><h3 style="margin:0">Your data</h3>
 <p class="mu" style="margin:0">Everything stays on this device. Nothing is sent anywhere. Last backup: ${lb==null?"never":lb==0?"today":lb+" day"+(lb==1?"":"s")+" ago"}.</p>
 <button class="p wide" data-a="backup">Back up to a file</button>
 <button class="wide" data-a="restore">Restore from a backup</button><input type="file" id="rf" accept=".json,application/json" hidden>
 <p class="mu" style="margin:0">Tip: add this page to your home screen so your phone treats it as an app and keeps its data.</p></div>`}

function render(){V.s=V.s||"home";const m={home,person,list,add,form,settings};$("app").innerHTML=m[V.s]();
 const q=$("q");if(q)q.oninput=()=>$("res").innerHTML=results(q.value);
 const c=$("car");if(c)c.onscroll=()=>{const n=c.children.length,i=Math.round(c.scrollLeft/c.clientWidth);$("pos").textContent=n>1?`${i+1} / ${n}`:""};
 const rf=$("rf");if(rf)rf.onchange=restore;window.scrollTo(0,0)}
function sync(){const a=$("an");if(a)A.name=a.value.trim();const b=$("ab");if(b)A.about=b.value;const d=$("fd");if(d&&V.s=="add")A.date=d.value}
function pickDate(i){const c=CH[i],d=new Date();if(c.d)d.setDate(d.getDate()+c.d);else d.setMonth(d.getMonth()+c.m);$("fd").value=ymd(d)}
const toTs=v=>new Date(v+"T09:00:00").getTime();

async function backup(){const data=JSON.stringify(D,null,1);let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:"connect-backup-"+ymd(new Date())+".json",data});D.lastBackup=Date.now();await save();toast("Backup saved");render()}catch(e){if(!e||e.code!="declined")toast("Could not save the backup")}}
 else{try{await navigator.clipboard.writeText(data);D.lastBackup=Date.now();await save();toast("Copied. Paste it into a note to keep it.");render()}catch(e){toast("Backup not available here")}}}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.people))throw 0;if(!confirm("Replace everything here with this backup?"))return;D=d;D.firstUse=D.firstUse||Date.now();await save();V={s:"home"};render();toast("Restored")}catch(x){toast("That doesn't look like a backup")}};r.readAsText(f)}

document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(t.tagName=="A")e.preventDefault();
 if(a=="backup")return backup();if(a=="restore")return $("rf").click();
 if(a=="chip")return pickDate(+t.dataset.i);
 if(a=="settings")V={s:"settings"};
 else if(a=="home")V={s:"home"};
 else if(a=="list"){L.page=0;V={s:"list"}}
 else if(a=="person")V={s:"person",id,back:V.s};
 else if(a=="back")V={s:V.back||"home"};
 else if(a=="sort"){L.sort=L.sort=="az"?"date":"az";L.page=0}
 else if(a=="pg")L.page+=+t.dataset.d;
 else if(a=="add"){A={step:1,name:"",f:rnd(FONTS.length),c:rnd(COLS.length),about:"",date:""};V={s:"add"}}
 else if(a=="font"){sync();A.f=+t.dataset.i}
 else if(a=="shuf"){sync();A.c=(A.c+1+rnd(COLS.length-1))%COLS.length}
 else if(a=="anext"){sync();if(A.step==1&&!A.name)return $("an").focus();A.step++}
 else if(a=="aback"){sync();A.step--}
 else if(a=="create"){sync();if(!A.date)return toast("Pick a date first");const id=Date.now().toString(36)+rnd(1e4).toString(36);
  D.people.push({id,name:A.name,f:A.f,c:A.c,due:toTs(A.date),notes:A.about.trim()?[{t:Date.now(),text:A.about.trim()}]:[]});await save();V={s:"person",id,back:"home"}}
 else if(a=="cancel")V=V.s=="form"?{s:"person",id:E.id,back:V.back}:{s:"home"};
 else if(a=="conn"||a=="note"||a=="date"){const p=get(V.id);E={id:p.id,m:a,date:a=="date"?p.due:null};V={s:"form",back:V.back}}
 else if(a=="fsave"){const p=get(E.id),ft=$("ft"),fd=$("fd"),text=ft?ft.value.trim():"";
  if(E.m=="note"&&!text)return ft.focus();if(E.m!="note"&&!fd.value)return toast("Pick a date first");
  const now=Date.now();if(E.m=="conn")p.notes.unshift({t:now,text,ci:true});if(E.m=="note")p.notes.unshift({t:now,text});if(E.m!="note")p.due=toTs(fd.value);
  await save();V={s:"person",id:p.id,back:V.back}}
 else if(a=="del"){const p=get(V.id);if(!confirm("Remove "+p.name+" and all their notes?"))return;D.people=D.people.filter(x=>x!==p);await save();V={s:"home"}}
 render()});

(async()=>{D=await load()||migrate()||{people:[],firstUse:Date.now(),lastBackup:0};D.firstUse=D.firstUse||Date.now();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 await save();render()})();
</script></body></html>
